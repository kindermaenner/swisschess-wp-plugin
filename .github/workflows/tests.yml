name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo, pdo_mysql, dom
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pest tests with coverage
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml --min=80

      - name: Install SonarScanner
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          version: latest

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=swisschess-wp-plugin \
            -Dsonar.sources=src \
            -Dsonar.php.coverage.reportPaths=coverage.xml \
            -Dsonar.tests=tests \
            -Dsonar.exclusions=vendor/** \
            -Dsonar.php.file.suffixes=php